name: content-editor

# ตัดต่อ/สร้างวิดีโอให้บอทคอนเทนต์ (LINE OA The moon)
# - รันทุก 5 นาที (GitHub อาจช้ากว่านั้นบ้าง) ดูว่ามีงานรอไหม ไม่มีก็จบภายในไม่กี่วินาที
# - ยืนยันตัวกับ Worker ด้วย OIDC ของ GitHub — ไม่มีรหัสลับใน repo นี้
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  id-token: write   # ขอ OIDC token ไปยืนยันตัวกับ Worker
  actions: write    # ต่ออายุ workflow ไม่ให้ GitHub ปิดเองหลัง 60 วัน
  contents: read

concurrency:
  group: content-editor
  cancel-in-progress: false

env:
  WORKER_URL: https://twilight-tooth-0afb.golf232527.workers.dev

jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: มีงานรอไหม
        id: check
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=content-bot" | jq -r .value)
          N=$(curl -sS -H "Authorization: Bearer $TOKEN" "$WORKER_URL/edit/pending" | jq -r '.count // 0')
          echo "งานรอ: $N"
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: ต่ออายุ workflow (กัน GitHub ปิด scheduled workflow อัตโนมัติ)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/edit.yml/enable" || true

      - uses: actions/checkout@v4
        if: steps.check.outputs.count != '0'

      - name: ติดตั้ง ffmpeg ฟอนต์ไทย และเสียงพากย์
        if: steps.check.outputs.count != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-thai-tlwg >/dev/null
          pip install -q edge-tts gTTS

      - name: ตัดต่อ/สร้างวิดีโอ
        if: steps.check.outputs.count != '0'
        run: python3 edit.py
